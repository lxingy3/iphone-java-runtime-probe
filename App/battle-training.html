<div id="resultsModal" class="modal" hidden><section class="sheet glass battleReport" data-glass="records" role="dialog" aria-modal="true" aria-labelledby="resultsTitle"><header class="sheetheader"><h2 id="resultsTitle">战斗成绩</h2><button class="round sheetclose" data-dismiss aria-label="关闭成绩"><svg><use href="#cross"/></svg></button></header><div class="sheetcontent"><div class="live" id="live" hidden><div><strong id="average">0</strong><span>平均 DPS</span></div><div class="time"><b id="remaining">120</b><span id="clocklabel">剩余秒数</span></div></div><div class="actions" id="runActions"><button id="again" class="secondary">重新测试</button><button id="stop" class="secondary">结束并结算</button></div><p class="groupcaption">最近 10 次</p><div id="records" class="records"><div class="empty">暂无成绩</div></div></div></section></div>
<script>
'use strict';
// This is a game control surface: preserve single-finger scrolling without page zoom.
for(const type of ['gesturestart','gesturechange','gestureend'])document.addEventListener(type,e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
const $=id=>document.getElementById(id);let serial=0,pending=new Map(),view={},selected=0,busy=false,polling=false,lastOk=0,toastTimer,modal=null,returnFocus=null,bossSignature='',recordSignature='',layoutFrame=0;
function bridge(action,args={}){return new Promise((resolve,reject)=>{if(!window.webkit?.messageHandlers?.training){reject(Error('请从游戏内打开训练场'));return}const id=++serial,timer=setTimeout(()=>{pending.delete(id);reject(Error('连接超时'))},8000);pending.set(id,{resolve,reject,timer});window.webkit.messageHandlers.training.postMessage({id,action,args});})}
window.trainingReply=({id,payload})=>{const item=pending.get(id);if(!item)return;clearTimeout(item.timer);pending.delete(id);if(payload?.retcode===0)item.resolve(payload);else item.reject(Error(payload?.message||'操作未完成'));};
function notice(text,error=false){clearTimeout(toastTimer);$('notice').textContent=text;$('notice').hidden=!text;$('notice').classList.toggle('error',error);if(text)toastTimer=setTimeout(()=>$('notice').hidden=true,error?6000:2500)}
function number(id,min,max,multiplier=1){const n=Number($(id).value)*multiplier;if(!Number.isFinite(n)||n!==Math.floor(n)||n<min||n>max)throw Error($(id).getAttribute('aria-label')+'超出范围');return n}
const format=n=>Math.round(Number(n)||0).toLocaleString('zh-CN');
function glassLayout(){if(layoutFrame)return;layoutFrame=requestAnimationFrame(()=>{layoutFrame=0;if(!document.documentElement.classList.contains('native-glass'))return;const rects=Array.from(document.querySelectorAll('[data-glass]')).filter(el=>el.getClientRects().length&&(!modal||el.closest('.modal'))).map(el=>{let r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,radius:parseFloat(getComputedStyle(el).borderRadius)||24}});window.webkit?.messageHandlers?.training?.postMessage({id:0,action:'layout',args:{rects,viewport:{width:window.visualViewport?.width||innerWidth,height:window.visualViewport?.height||innerHeight,x:window.visualViewport?.offsetLeft||0,y:window.visualViewport?.offsetTop||0}}})})}
new ResizeObserver(glassLayout).observe(document.documentElement);window.addEventListener('resize',glassLayout);window.visualViewport?.addEventListener('resize',glassLayout);window.visualViewport?.addEventListener('scroll',glassLayout);
function openModal(id){if(modal)modal.hidden=true;else returnFocus=document.activeElement;modal=$(id);modal.hidden=false;$('screen').inert=true;$('screen').setAttribute('aria-hidden','true');modal.querySelector('input,button')?.focus();glassLayout()}
function closeModal(){if(!modal)return;modal.hidden=true;modal=null;$('screen').inert=false;$('screen').removeAttribute('aria-hidden');returnFocus?.focus();glassLayout()}
document.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=closeModal);document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){e.preventDefault();closeModal()}if(e.key==='Tab'&&modal){const all=Array.from(modal.querySelectorAll('button:not(:disabled),input,select')).filter(e=>e.getClientRects().length);let first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function choose(id){selected=id;const row=(view.bosses||[]).find(b=>b.id===id);$('selected').textContent=id?(row?.name||'选择对手'):'训练木桩';$('hpstep').hidden=!id;$('hpInfinite').hidden=!!id;$('timestep').hidden=!!id;$('timeInfinite').hidden=!id;$('energyrow').hidden=!!id;$('bosshealth').hidden=!id;$('resistanceOption').hidden=true;$('presetrow').hidden=!!id;$('healOption').hidden=!!id;document.querySelectorAll('.portraitbutton').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.pick)===id)));renderBosses();controls();glassLayout()}
function renderBosses(){const key=$('search').value.trim(),rows=(view.bosses||[]).filter(b=>b.name.includes(key)),sig=JSON.stringify(rows)+':'+selected;if(sig===bossSignature)return;bossSignature=sig;const list=$('bosslist');list.replaceChildren();for(const b of rows){const button=document.createElement('button');button.className='boss';button.dataset.available=String(b.available);button.disabled=!b.available||busy;button.setAttribute('aria-pressed',String(selected===b.id));const title=document.createElement('span');title.textContent=b.name;const state=document.createElement('small');state.textContent=b.available?(b.note==='7.2 新增'?'7.2':''):'未开放';button.append(title,state);button.onclick=()=>{choose(b.id);closeModal()};list.append(button)}if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配结果';list.append(empty)}}
function renderRecords(results){
 const sig=JSON.stringify(results);if(sig===recordSignature)return;recordSignature=sig;const records=$('records');records.replaceChildren();
 for(const r of results){const row=document.createElement('div');row.className='record';const top=document.createElement('div');top.className='recordtop';
 const left=document.createElement('div'),title=document.createElement('b'),detail=document.createElement('span');title.textContent=(r.title||'训练木桩')+' · '+(r.outcome||'完成');detail.textContent=Number(r.seconds||0).toFixed(1)+' 秒 · '+format(r.hitCount)+' 次命中'+(r.saved===false?' · 待保存':'');left.append(title,detail);
 const score=document.createElement('div');score.className='score';const num=document.createElement('strong'),label=document.createElement('span');num.textContent=format(r.averageDps);label.textContent='平均 DPS';score.append(num,label);top.append(left,score);row.append(top);
 const total=document.createElement('p');total.className='recordtotal';total.textContent='总伤害 '+format(r.totalDamage)+'　最高一击 '+format(r.maxHit);row.append(total);
 const breakdown=document.createElement('div');breakdown.className='breakdown';
 for(const a of r.byAvatar||[]){const line=document.createElement('div');line.className='avatarshare';const name=document.createElement('b'),damage=document.createElement('span'),bar=document.createElement('i');name.textContent=a.name||'未归属';damage.textContent=format(a.damage)+' · '+Number(a.share||0).toFixed(1)+'%';bar.style.setProperty('--share',Math.max(0,Math.min(100,Number(a.share)||0))+'%');line.append(name,damage,bar);breakdown.append(line)}row.append(breakdown);appendReport(row,r);records.append(row)}
 if(!results.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无成绩';records.append(empty)}
}
let labHydrated=false;
function render(data){view=data;if(data.dps?.config&&!labHydrated){hydrateLab(data.dps.config);labHydrated=true;}lastOk=Date.now();$('health').textContent=data.online?(data.ready?'世界已连接':'场景加载中'):'尚未进入世界';$('arena').textContent=data.inArena?'独立训练室':'大世界';$('hud').checked=data.showHud!==false;const d=data.dps||{};$('live').hidden=!d.active;$('remaining').textContent=d.mode==='boss'||d.remainingSeconds===-1?Math.floor(d.elapsedSeconds||0):Math.ceil(d.remainingSeconds||0);$('clocklabel').textContent=d.phase==='countdown'?'准备开始':d.mode==='boss'||d.remainingSeconds===-1?'战斗秒数':'剩余秒数';$('average').textContent=format(d.averageDps);$('bosshealth').textContent=data.boss?'剩余生命 '+format(data.boss.hp):'';document.querySelectorAll('[data-name]').forEach(b=>{const item=(data.bosses||[]).find(x=>x.name===b.dataset.name);if(item)b.dataset.pick=item.id;b.disabled=!item?.available});renderBosses();renderRecords(data.results||[]);controls()}
function controls(){document.querySelectorAll('button').forEach(b=>{if(!b.matches('#close,[data-dismiss],#results,#settings,#allbosses'))b.disabled=busy});if(busy)return;document.querySelectorAll('.boss').forEach(b=>b.disabled=b.dataset.available!=='true');document.querySelectorAll('[data-name]').forEach(b=>b.disabled=!(view.bosses||[]).some(x=>x.id===Number(b.dataset.pick)&&x.available));$('start').disabled=!view.ready||!!view.dps?.active||(!!selected&&!(view.bosses||[]).some(b=>b.id===selected&&b.available));$('start').textContent=view.dps?.active?'测试中':selected?'开始挑战':'布置木桩';$('again').disabled=!view.ready||!(view.hasPreviousDps||view.hasPreviousBoss);$('stop').disabled=!view.ready||!view.dps?.active;$('clearboss').disabled=!view.ready||!view.boss;$('enter').disabled=!view.ready||!!view.inArena;$('leave').disabled=!view.ready||!view.canReturn;for(const id of ['restore','supplies','fill','hud'])$(id).disabled=!view.ready;document.querySelectorAll('[data-step]').forEach(b=>{const [id,step]=b.dataset.step.split(':'),v=Number($(id).value);b.disabled=Number(step)<0?v<=Number($(id).min):v>=Number($(id).max)})}
async function refresh(){if(polling||busy)return;polling=true;try{render(await bridge('status'))}catch(e){if(Date.now()-lastOk>3000){view.ready=false;$('health').textContent='连接中';controls()}}finally{polling=false}}
async function act(action,args={}){if(busy)return;busy=true;controls();try{render(await bridge(action,args));if(action==='labResetAvatars')renderAvatars();notice(({restoreHp:args.supplies?'食物已补齐':'队伍已恢复',fillEnergy:'能量已回满',bossClear:'已清场',dpsStop:'已结算',hudToggle:'已更新',labAvatar:'本次角色属性已更新',labResetAvatars:'已恢复原始属性',partyHeal:'全队生命已回满',partyRevive:'全队已复活',partyEnergy:'能量已调整'})[action]||'');if(['labPrepare','labStart','labAgain','dpsStart','dpsAgain','bossSpawn','bossAgain','arenaEnter','arenaExit'].includes(action))await bridge('close')}catch(e){notice(e.message,true)}finally{busy=false;controls()}}

const labElements=[['physical','物'],['fire','火'],['water','水'],['ice','冰'],['electric','雷'],['grass','草'],['wind','风'],['rock','岩']];
const labFields=[['hp','生命值'],['attack','攻击力'],['defense','防御力'],['mastery','元素精通'],['crit','暴击率 %'],['critDamage','暴击伤害 %'],['recharge','元素充能 %'],...labElements.map(([k,n])=>[k+'Bonus',n+'伤加成 %'])];let editedAvatar=0,statPage="base";
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
for(const [key,name] of labElements){const row=node('div',undefined,'resistanceitem'),label=node('label',name);label.htmlFor='res-'+key;const n=document.createElement('input');Object.assign(n,{type:'number',min:-100,max:1000,value:10,id:'res-'+key});n.setAttribute('aria-label',name+'元素抗性，百分比');const immune=node('label','免疫'),box=document.createElement('input');box.type='checkbox';box.id='immune-'+key;box.setAttribute('aria-label',name+'元素免疫');immune.prepend(box);row.append(label,n,immune);$('labResistances').append(row)}
function setDuration(n){$('seconds').value=n;document.querySelectorAll('[data-duration]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.duration)===n)))}
document.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>setDuration(Number(b.dataset.duration)));
$('labPreset').onchange=()=>{const v=$('labPreset').value;if(v!=='custom'){$('level').value=({world:103,stygian5:105,stygian6:110})[v];$('labDefense').value=100;for(const [key] of labElements)$('res-'+key).value=10}controls()};
function hydrateLab(c){for(const id of ['level','seconds'])if(c[id]!==undefined)$(id).value=c[id];setDuration(c.seconds??120);$('labPreset').value=c.preset||'custom';$('energyMode').value=c.energy??-1;$('labDefense').value=c.defense??100;$('labAura').value=c.aura||'none';$('heal').checked=c.heal!==false;for(const [key] of labElements){$('res-'+key).value=c.resistances?.[key]??10;$('immune-'+key).checked=c.immunities?.includes(key)||false}for(const [id,key] of [['labChart','chart'],['labPanel','panel'],['labResistanceHud','resistanceHud']])$(id).checked=!!c[key]}
for(const [id,key] of [['labChart','chart'],['labPanel','panel'],['labResistanceHud','resistanceHud']])$(id).onchange=()=>{if(view.dps?.mode==='lab')act('labDisplay',{[key]:$(id).checked})};
function labConfig(){const resistances={},immunities=[];for(const [key] of labElements){const v=Number($('res-'+key).value);if(!Number.isFinite(v)||v< -100||v>1000)throw Error('抗性需在 −100% 至 1000% 之间');resistances[key]=v;if($('immune-'+key).checked)immunities.push(key)}const defense=Number($('labDefense').value);if(!Number.isFinite(defense)||defense<0||defense>1000)throw Error('防御倍率需在 0% 至 1000% 之间');return{preset:$('labPreset').value,level:number('level',1,110),seconds:number('seconds',0,120),energy:Number($('energyMode').value),heal:$('heal').checked,defense,resistances,immunities,aura:$('labAura').value,chart:$('labChart').checked,panel:$('labPanel').checked,resistanceHud:$('labResistanceHud').checked}}
$('applyLab').onclick=()=>{try{act('labPrepare',labConfig())}catch(e){notice(e.message,true)}};
document.querySelectorAll('[data-statpage]').forEach(b=>b.onclick=()=>{statPage=b.dataset.statpage;document.querySelectorAll('[data-statpage]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('#labStats .statfield').forEach(x=>x.hidden=(x.querySelector('input').dataset.stat.endsWith('Bonus')?'bonus':'base')!==statPage);glassLayout()});
$('applyElements').onclick=()=>{try{act('labPrepare',labConfig())}catch(e){notice(e.message,true)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));document.querySelectorAll('[data-tabpanel]').forEach(p=>p.hidden=p.dataset.tabpanel!==b.dataset.tab);glassLayout()});
function openTrainingSection(tab){if(tab==='timing'||tab==='target'){if(modal)closeModal();return}if(!['elements','party','display','supplies'].includes(tab))return;renderAvatars();openModal('settingsModal');document.querySelector('[data-tab="'+tab+'"]').click()}
function renderAvatars(){const party=view.party||[];if(!party.some(a=>a.avatarId===editedAvatar))editedAvatar=party[0]?.avatarId||0;$('labAvatars').replaceChildren();for(const a of party){const b=node('button',a.name);b.setAttribute('aria-pressed',String(a.avatarId===editedAvatar));b.onclick=()=>{editedAvatar=a.avatarId;renderAvatars()};$('labAvatars').append(b)}$('labStats').replaceChildren();const a=party.find(a=>a.avatarId===editedAvatar);if(!a){$('labStats').append(node('p','进入世界后显示队伍','subtle'));return}for(const [key,name] of labFields){const label=node('label',name,'statfield'),input=document.createElement('input');input.type='number';input.inputMode='decimal';input.dataset.stat=key;input.placeholder=Number(a[key]||0).toFixed(key==='hp'||key==='attack'||key==='defense'||key==='mastery'?0:1);input.value=a.overrides?.[key]??'';input.setAttribute('aria-label',name);label.append(input);label.hidden=(key.endsWith('Bonus')?'bonus':'base')!==statPage;$('labStats').append(label)}}
$('applyAvatar').onclick=()=>{if(!editedAvatar)return;const values={};for(const input of document.querySelectorAll('[data-stat]'))if(input.value.trim()){const v=Number(input.value);if(!Number.isFinite(v)||v<0){notice('请输入有效的角色属性',true);return}values[input.dataset.stat]=v}act('labAvatar',{avatarId:editedAvatar,values})};$('resetAvatars').onclick=()=>act('labResetAvatars');$('partyHeal').onclick=()=>act('partyHeal');$('partyRevive').onclick=()=>act('partyRevive');$('zeroEnergy').onclick=()=>act('partyEnergy',{energy:0});
function reportTable(headers,rows){const wrap=node('div',undefined,'reporttablewrap'),table=node('table',undefined,'reporttable'),thead=node('thead'),tr=node('tr');for(const h of headers)tr.append(node('th',h));thead.append(tr);table.append(thead);const body=node('tbody');for(const r of rows){const tr=node('tr');for(const c of r)tr.append(node('td',c));body.append(tr)}table.append(body);wrap.append(table);return wrap}
function chartElement(points){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 600 150');svg.classList.add('chartsvg');svg.setAttribute('role','img');svg.setAttribute('aria-label','DPS 曲线');const mx=Math.max(1,...points.map(p=>Number(p.dps)||0)),end=Math.max(1,...points.map(p=>Number(p.seconds)||0));for(let i=0;i<3;i++){const line=document.createElementNS(ns,'line');for(const [k,v] of Object.entries({x1:50,x2:590,y1:15+50*i,y2:15+50*i}))line.setAttribute(k,v);svg.append(line);const t=document.createElementNS(ns,'text');t.setAttribute('x',2);t.setAttribute('y',19+50*i);t.textContent=format(mx*(1-i/2));svg.append(t)}const path=document.createElementNS(ns,'path');path.setAttribute('d',points.map((p,i)=>(i?'L':'M')+(50+540*p.seconds/end).toFixed(1)+' '+(115-100*p.dps/mx).toFixed(1)).join(' '));svg.append(path);for(const [x,text] of [[50,'0秒'],[550,end.toFixed(0)+'秒']]){const t=document.createElementNS(ns,'text');t.setAttribute('x',x);t.setAttribute('y',140);t.textContent=text;svg.append(t)}return svg}
function appendReport(row,r){if(!r.environment&&!r.party)return;const detail=node('details',undefined,'reportdetails');detail.append(node('summary','完整战报'));const e=r.environment||{},env=node('div',undefined,'reportenvironment');for(const text of [({0:'零能量启动',100:'满能量启动'})[e.energy]||'保留能量','等级 '+(e.level||'—'),'防御 '+(e.defense??100)+'%','自挂 '+(labElements.find(v=>v[0]===e.aura)?.[1]||'无')])env.append(node('span',text));detail.append(env);const resist=node('p',undefined,'subtle');resist.textContent=labElements.map(([k,n])=>n+' '+(e.immunities?.includes(k)?'免疫':(e.resistances?.[k]??10)+'%')).join('　');detail.append(resist);detail.append(reportTable(['队伍','伤害','DPS','占比','命中','站场时间'],(r.byAvatar||[]).map(a=>[a.name,format(a.damage),format(a.dps),Number(a.share||0).toFixed(2)+'%',format(a.hits),Number(a.fieldSeconds||0).toFixed(1)+'秒'])));if(Object.keys(r.byReaction||{}).length){detail.append(reportTable(['反应伤害','伤害'],Object.entries(r.byReaction).map(([k,v])=>[k,format(v)])))}if(r.party?.length)detail.append(reportTable(['开局面板','暴击/暴伤','充能','生命','攻击','防御','精通','增伤'],r.party.map(a=>[a.name,Number(a.crit||0).toFixed(1)+' / '+Number(a.critDamage||0).toFixed(1)+'%',Number(a.recharge||0).toFixed(1)+'%',format(a.hp),format(a.attack),format(a.defense),format(a.mastery),labElements.filter(([k])=>a[k+'Bonus']).map(([k,n])=>n+Number(a[k+'Bonus']).toFixed(1)+'%').join(' ')||'0%'])));if(r.curve?.length)detail.append(chartElement(r.curve));row.append(detail)}
$('start').onclick=()=>{try{if(selected)act('bossSpawn',{id:selected,level:number('level',1,110),hp:number('hp',1000,1000000000,10000)});else act('labPrepare',labConfig())}catch(e){notice(e.message,true)}};
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const [id,step]=b.dataset.step.split(':'),input=$(id);input.value=Math.min(Number(input.max),Math.max(Number(input.min),(Number(input.value)||0)+Number(step)));if(id==='level')$('labPreset').value='custom';controls()});document.querySelectorAll('input[type=number]').forEach(input=>input.oninput=()=>{if(input.id==='level'||input.id==='labDefense'||input.id.startsWith('res-'))$('labPreset').value='custom';controls()});
document.querySelectorAll('.portraitbutton').forEach(b=>b.onclick=()=>choose(Number(b.dataset.pick)));$('allbosses').onclick=()=>openModal('catalogModal');$('settings').onclick=()=>{renderAvatars();openModal('settingsModal')};$('results').onclick=()=>openModal('resultsModal');$('search').oninput=renderBosses;$('reset').onclick=()=>{$('level').value=100;$('hp').value=5000;$('seconds').value=120;setDuration(120);$('labPreset').value='custom';$('energyMode').value='-1';$('labDefense').value=100;$('labAura').value='none';for(const e of labElements){$('res-'+e[0]).value=10;$('immune-'+e[0]).checked=false;}$('resistance').value=10;$('energy').checked=false;$('heal').checked=true;controls();notice('已重置')};for(const [id,action] of Object.entries({again:'dpsAgain',stop:'dpsStop',clearboss:'bossClear',enter:'arenaEnter',leave:'arenaExit',restore:'restoreHp',fill:'fillEnergy'}))$(id).onclick=()=>act(action);$('again').onclick=()=>act((view.dps?.mode||view.results?.[0]?.mode)==='boss'?'bossAgain':(view.dps?.mode||view.results?.[0]?.mode)==='lab'?'labAgain':'dpsAgain');$('stop').onclick=()=>act(view.dps?.mode==='lab'?'labStop':'dpsStop');$('supplies').onclick=()=>act('restoreHp',{supplies:true});$('hud').onchange=()=>act('hudToggle',{enabled:$('hud').checked});$('close').onclick=()=>bridge('close').catch(()=>{});controls();refresh();setInterval(refresh,1000);glassLayout();
</script></html>
