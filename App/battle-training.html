<main class="screen" id="screen"><header class="masthead"><svg aria-hidden="true"><use href="#swords"/></svg><h1>木桩训练场</h1></header><button id="close" class="round close" aria-label="返回游戏"><svg><use href="#cross"/></svg></button>
<section class="config glass" data-glass="config" aria-labelledby="selected"><div class="panelhead"><h2 id="selected">训练木桩</h2><div class="ornament" aria-hidden="true">✦</div></div><div class="parameters">

<div class="parameter"><label for="hp">生命值</label><div class="stepper" id="hpstep" hidden><button data-step="hp:-1000" aria-label="减少生命值">−</button><div class="value"><input id="hp" aria-label="生命值，万" type="number" inputmode="decimal" min="0.1" max="100000" step="0.1" value="5000"><span class="unit">万</span></div><button data-step="hp:1000" aria-label="增加生命值">＋</button></div><div class="fixedvalue" id="hpInfinite">不限</div></div>
<div class="parameter"><label for="seconds">时长</label><div class="stepper" id="timestep"><button data-step="seconds:-30" aria-label="减少测试时长">−</button><div class="value"><input id="seconds" aria-label="测试时长，秒" type="number" min="1" max="120" value="120" inputmode="numeric"><span class="unit">秒</span></div><button data-step="seconds:30" aria-label="增加测试时长">＋</button></div><div class="fixedvalue" id="timeInfinite" hidden>不限</div></div>
<div class="parameter"><label for="targets">目标</label><div class="stepper" id="targetstep"><button data-step="targets:-1" aria-label="减少目标数量">−</button><div class="value"><input id="targets" aria-label="目标数量" type="number" min="1" max="5" value="1" inputmode="numeric"></div><button data-step="targets:1" aria-label="增加目标数量">＋</button></div><div class="fixedvalue" id="singleTarget" hidden>1</div></div>
<label class="energyrow" id="energyrow"><input id="energy" type="checkbox">开局满能量</label><div class="energyrow" id="bosshealth" hidden></div></div><footer class="configfooter"><div class="ornament" aria-hidden="true">✦</div><button id="start" class="primary" disabled>开始测试</button><div class="footactions"><button id="reset" class="textbutton">重置</button><button id="settings" class="textbutton">更多设置</button></div></footer></section>

<div id="notice" role="status" aria-live="polite" hidden></div>
<div id="catalogModal" class="modal" hidden><section class="sheet glass" data-glass="catalog" role="dialog" aria-modal="true" aria-labelledby="catalogTitle"><header class="sheetheader"><h2 id="catalogTitle">选择对手</h2><button class="round sheetclose" data-dismiss aria-label="关闭怪物列表"><svg><use href="#cross"/></svg></button></header><label class="search"><svg aria-hidden="true"><use href="#searchicon"/></svg><input id="search" placeholder="搜索怪物" aria-label="搜索怪物" autocomplete="off"></label><div class="sheetcontent"><div id="bosslist" class="bosslist"></div></div></section></div>
<div id="settingsModal" class="modal" hidden><section class="sheet glass" data-glass="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><header class="sheetheader"><h2 id="settingsTitle">训练设置</h2><button class="round sheetclose" data-dismiss aria-label="关闭设置"><svg><use href="#cross"/></svg></button></header><div class="sheetcontent"><div class="options"><label class="option" id="resistanceOption">木桩全抗性<select id="resistance"><option value="-20">−20%</option><option value="0">0%</option><option value="10" selected>10%</option><option value="30">30%</option><option value="50">50%</option><option value="70">70%</option><option value="90">90%</option></select></label><label class="option" id="healOption">测试前复活回血<input type="checkbox" id="heal" checked></label><label class="option">显示战斗统计<input type="checkbox" id="hud" checked></label></div><div class="actions"><button id="restore" class="secondary">复活回血</button><button id="supplies" class="secondary">补充复苏食物</button><button id="fill" class="secondary">回满能量</button><button id="clearboss" class="secondary">清除对手</button></div><p id="arena" class="groupcaption">大世界</p><div class="actions"><button id="enter" class="secondary">进入训练室</button><button id="leave" class="secondary">返回原地</button></div></div></section></div>
<div id="resultsModal" class="modal" hidden><section class="sheet glass" data-glass="records" role="dialog" aria-modal="true" aria-labelledby="resultsTitle"><header class="sheetheader"><h2 id="resultsTitle">战斗成绩</h2><button class="round sheetclose" data-dismiss aria-label="关闭成绩"><svg><use href="#cross"/></svg></button></header><div class="sheetcontent"><div class="live" id="live" hidden><div><strong id="average">0</strong><span>平均 DPS</span></div><div class="time"><b id="remaining">120</b><span id="clocklabel">剩余秒数</span></div></div><div class="actions" id="runActions"><button id="again" class="secondary">重新测试</button><button id="stop" class="secondary">结束并结算</button></div><p class="groupcaption">最近 10 次</p><div id="records" class="records"><div class="empty">暂无成绩</div></div></div></section></div>
<script>
'use strict';const $=id=>document.getElementById(id);let serial=0,pending=new Map(),view={},selected=0,busy=false,polling=false,lastOk=0,toastTimer,modal=null,returnFocus=null,bossSignature='',recordSignature='',layoutFrame=0;
function bridge(action,args={}){return new Promise((resolve,reject)=>{if(!window.webkit?.messageHandlers?.training){reject(Error('请从游戏内打开训练场'));return}const id=++serial,timer=setTimeout(()=>{pending.delete(id);reject(Error('连接超时'))},8000);pending.set(id,{resolve,reject,timer});window.webkit.messageHandlers.training.postMessage({id,action,args});})}
window.trainingReply=({id,payload})=>{const item=pending.get(id);if(!item)return;clearTimeout(item.timer);pending.delete(id);if(payload?.retcode===0)item.resolve(payload);else item.reject(Error(payload?.message||'操作未完成'));};
function notice(text,error=false){clearTimeout(toastTimer);$('notice').textContent=text;$('notice').hidden=!text;$('notice').classList.toggle('error',error);if(text)toastTimer=setTimeout(()=>$('notice').hidden=true,error?6000:2500)}
function number(id,min,max,multiplier=1){const n=Number($(id).value)*multiplier;if(!Number.isFinite(n)||n!==Math.floor(n)||n<min||n>max)throw Error($(id).getAttribute('aria-label')+'超出范围');return n}
const format=n=>Math.round(Number(n)||0).toLocaleString('zh-CN');
function glassLayout(){if(layoutFrame)return;layoutFrame=requestAnimationFrame(()=>{layoutFrame=0;if(!document.documentElement.classList.contains('native-glass'))return;const rects=Array.from(document.querySelectorAll('[data-glass]')).filter(el=>el.getClientRects().length&&(!modal||el.closest('.modal'))).map(el=>{let r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,radius:parseFloat(getComputedStyle(el).borderRadius)||24}});window.webkit?.messageHandlers?.training?.postMessage({id:0,action:'layout',args:{rects}})})}
new ResizeObserver(glassLayout).observe(document.documentElement);window.addEventListener('resize',glassLayout);
function openModal(id){if(modal)modal.hidden=true;else returnFocus=document.activeElement;modal=$(id);modal.hidden=false;$('screen').inert=true;$('screen').setAttribute('aria-hidden','true');modal.querySelector('input,button')?.focus();glassLayout()}
function closeModal(){if(!modal)return;modal.hidden=true;modal=null;$('screen').inert=false;$('screen').removeAttribute('aria-hidden');returnFocus?.focus();glassLayout()}
document.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=closeModal);document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){e.preventDefault();closeModal()}if(e.key==='Tab'&&modal){const all=Array.from(modal.querySelectorAll('button:not(:disabled),input,select')).filter(e=>e.getClientRects().length);let first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function choose(id){selected=id;const row=(view.bosses||[]).find(b=>b.id===id);$('selected').textContent=id?(row?.name||'选择对手'):'训练木桩';$('hpstep').hidden=!id;$('hpInfinite').hidden=!!id;$('timestep').hidden=!!id;$('timeInfinite').hidden=!id;$('targetstep').hidden=!!id;$('singleTarget').hidden=!id;$('energyrow').hidden=!!id;$('bosshealth').hidden=!id;$('resistanceOption').hidden=!!id;$('healOption').hidden=!!id;document.querySelectorAll('.portraitbutton').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.pick)===id)));renderBosses();controls();glassLayout()}
function renderBosses(){const key=$('search').value.trim(),rows=(view.bosses||[]).filter(b=>b.name.includes(key)),sig=JSON.stringify(rows)+':'+selected;if(sig===bossSignature)return;bossSignature=sig;const list=$('bosslist');list.replaceChildren();for(const b of rows){const button=document.createElement('button');button.className='boss';button.dataset.available=String(b.available);button.disabled=!b.available||busy;button.setAttribute('aria-pressed',String(selected===b.id));const title=document.createElement('span');title.textContent=b.name;const state=document.createElement('small');state.textContent=b.available?(b.note==='7.2 新增'?'7.2':''):'未开放';button.append(title,state);button.onclick=()=>{choose(b.id);closeModal()};list.append(button)}if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配结果';list.append(empty)}}
function renderRecords(results){
 const sig=JSON.stringify(results);if(sig===recordSignature)return;recordSignature=sig;const records=$('records');records.replaceChildren();
 for(const r of results){const row=document.createElement('div');row.className='record';const top=document.createElement('div');top.className='recordtop';
 const left=document.createElement('div'),title=document.createElement('b'),detail=document.createElement('span');title.textContent=(r.title||'训练木桩')+' · '+(r.outcome||'完成');detail.textContent=Number(r.seconds||0).toFixed(1)+' 秒 · '+format(r.hitCount)+' 次命中'+(r.saved===false?' · 待保存':'');left.append(title,detail);
 const score=document.createElement('div');score.className='score';const num=document.createElement('strong'),label=document.createElement('span');num.textContent=format(r.averageDps);label.textContent='平均 DPS';score.append(num,label);top.append(left,score);row.append(top);
 const total=document.createElement('p');total.className='recordtotal';total.textContent='总伤害 '+format(r.totalDamage)+'　最高一击 '+format(r.maxHit);row.append(total);
 const breakdown=document.createElement('div');breakdown.className='breakdown';
 for(const a of r.byAvatar||[]){const line=document.createElement('div');line.className='avatarshare';const name=document.createElement('b'),damage=document.createElement('span'),bar=document.createElement('i');name.textContent=a.name||'未归属';damage.textContent=format(a.damage)+' · '+Number(a.share||0).toFixed(1)+'%';bar.style.setProperty('--share',Math.max(0,Math.min(100,Number(a.share)||0))+'%');line.append(name,damage,bar);breakdown.append(line)}row.append(breakdown);records.append(row)}
 if(!results.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无成绩';records.append(empty)}
}
function render(data){view=data;lastOk=Date.now();$('health').textContent=data.online?(data.ready?'世界已连接':'场景加载中'):'尚未进入世界';$('arena').textContent=data.inArena?'独立训练室':'大世界';$('hud').checked=data.showHud!==false;const d=data.dps||{};$('live').hidden=!d.active;$('remaining').textContent=d.mode==='boss'?Math.floor(d.elapsedSeconds||0):(d.remainingSeconds||0);$('clocklabel').textContent=d.mode==='boss'?'战斗秒数':'剩余秒数';$('average').textContent=format(d.averageDps);$('bosshealth').textContent=data.boss?'剩余生命 '+format(data.boss.hp):'';document.querySelectorAll('[data-name]').forEach(b=>{const item=(data.bosses||[]).find(x=>x.name===b.dataset.name);if(item)b.dataset.pick=item.id;b.disabled=!item?.available});renderBosses();renderRecords(data.results||[]);controls()}
function controls(){document.querySelectorAll('button').forEach(b=>{if(!b.matches('#close,[data-dismiss],#results,#settings,#allbosses'))b.disabled=busy});if(busy)return;document.querySelectorAll('.boss').forEach(b=>b.disabled=b.dataset.available!=='true');document.querySelectorAll('[data-name]').forEach(b=>b.disabled=!(view.bosses||[]).some(x=>x.id===Number(b.dataset.pick)&&x.available));$('start').disabled=!view.ready||!!view.dps?.active||(!!selected&&!(view.bosses||[]).some(b=>b.id===selected&&b.available));$('start').textContent=view.dps?.active?'测试中':selected?'开始挑战':'开始测试';$('again').disabled=!view.ready||!(view.hasPreviousDps||view.hasPreviousBoss);$('stop').disabled=!view.ready||!view.dps?.active;$('clearboss').disabled=!view.ready||!view.boss;$('enter').disabled=!view.ready||!!view.inArena;$('leave').disabled=!view.ready||!view.canReturn;for(const id of ['restore','supplies','fill','hud'])$(id).disabled=!view.ready;document.querySelectorAll('[data-step]').forEach(b=>{const [id,step]=b.dataset.step.split(':'),v=Number($(id).value);b.disabled=Number(step)<0?v<=Number($(id).min):v>=Number($(id).max)})}
async function refresh(){if(polling||busy)return;polling=true;try{render(await bridge('status'))}catch(e){if(Date.now()-lastOk>3000){view.ready=false;$('health').textContent='连接中';controls()}}finally{polling=false}}
async function act(action,args={}){if(busy)return;busy=true;controls();try{render(await bridge(action,args));notice(({restoreHp:args.supplies?'食物已补齐':'队伍已恢复',fillEnergy:'能量已回满',bossClear:'已清场',dpsStop:'已结算',hudToggle:'已更新'})[action]||'');if(['dpsStart','dpsAgain','bossSpawn','bossAgain','arenaEnter','arenaExit'].includes(action))await bridge('close')}catch(e){notice(e.message,true)}finally{busy=false;controls()}}
$('start').onclick=()=>{try{if(selected)act('bossSpawn',{id:selected,level:number('level',1,110),hp:number('hp',1000,1000000000,10000)});else act('dpsStart',{seconds:number('seconds',1,120),targets:number('targets',1,5),level:number('level',1,110),resistance:number('resistance',-100,90),energy:$('energy').checked?100:-1,heal:$('heal').checked})}catch(e){notice(e.message,true)}};
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const [id,step]=b.dataset.step.split(':'),input=$(id);input.value=Math.min(Number(input.max),Math.max(Number(input.min),(Number(input.value)||0)+Number(step)));controls()});document.querySelectorAll('input[type=number]').forEach(input=>input.oninput=controls);
document.querySelectorAll('.portraitbutton').forEach(b=>b.onclick=()=>choose(Number(b.dataset.pick)));$('allbosses').onclick=()=>openModal('catalogModal');$('settings').onclick=()=>openModal('settingsModal');$('results').onclick=()=>openModal('resultsModal');$('search').oninput=renderBosses;$('reset').onclick=()=>{$('level').value=100;$('hp').value=5000;$('seconds').value=120;$('targets').value=1;$('resistance').value=10;$('energy').checked=false;$('heal').checked=true;controls();notice('已重置')};for(const [id,action] of Object.entries({again:'dpsAgain',stop:'dpsStop',clearboss:'bossClear',enter:'arenaEnter',leave:'arenaExit',restore:'restoreHp',fill:'fillEnergy'}))$(id).onclick=()=>act(action);$('again').onclick=()=>act((view.dps?.mode||view.results?.[0]?.mode)==='boss'?'bossAgain':'dpsAgain');$('supplies').onclick=()=>act('restoreHp',{supplies:true});$('hud').onchange=()=>act('hudToggle',{enabled:$('hud').checked});$('close').onclick=()=>bridge('close').catch(()=>{});controls();refresh();setInterval(refresh,1000);glassLayout();
</script></html>
