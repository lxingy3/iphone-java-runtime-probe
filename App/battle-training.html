<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>木桩训练场</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#eff3f8;background:#101923}*{box-sizing:border-box}body{margin:0;padding:18px max(18px,env(safe-area-inset-right)) 30px max(18px,env(safe-area-inset-left))}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:0 0 14px}p{color:#b0bdcc;line-height:1.55;margin:8px 0}.eyebrow{font-size:11px;color:#ecc67e;letter-spacing:2px}button,input,select{font:inherit}button,select,input{min-height:44px;border-radius:6px;border:1px solid #39495b;color:#f3f6fa;background:#1b2a3a;padding:10px 12px}button{cursor:pointer;font-weight:600}button:active{transform:scale(.985)}button:disabled{opacity:.4;cursor:default}.primary{color:#1e2226;background:#f1d08d;border-color:#f1d08d}.quiet{background:transparent}.danger{color:#ffc3b5;border-color:#885a54}.tabs{display:flex;gap:8px;margin:20px 0 16px}.tabs button{flex:1}.tabs [aria-selected=true]{border-color:#f1d08d;color:#f1d08d;background:#293442}.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:1100px;margin:auto}.card{background:#172331;border:1px solid #2e4053;border-radius:8px;padding:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#c7d2df}label input,label select{width:100%;color:#fff}.full{grid-column:1/-1}.checks{flex-direction:row;align-items:center;gap:10px}.checks input{width:22px;height:22px;min-height:22px;accent-color:#f1d08d}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.row button{flex:1;min-width:115px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#101b27;border-radius:6px;padding:14px}.stat b{display:block;font-size:23px;margin-top:5px;font-variant-numeric:tabular-nums}.muted{font-size:12px;color:#9eb0c1}.bosslist{display:flex;flex-direction:column;gap:8px;max-height:310px;overflow:auto;margin-top:12px}.boss{display:flex;justify-content:space-between;text-align:left;align-items:center;gap:8px}.boss[aria-pressed=true]{border-color:#f1d08d;background:#30382f}.boss small{font-size:11px;color:#b3c1cf}#notice{padding:12px 16px;border-radius:6px;background:#213c4e;margin:12px 0;min-height:44px;line-height:1.5}#notice.error{background:#4a292d}.hidden,[hidden]{display:none!important}.record{border-bottom:1px solid #35465a;padding:13px 0;display:flex;justify-content:space-between;gap:12px}.record:last-child{border:0}.record b{color:#f3d697}.toolbar{max-width:1100px;margin:auto}#health{font-size:12px;color:#a7d9c2}#close{min-width:74px}input:focus,select:focus,button:focus-visible{outline:2px solid #f1d08d;outline-offset:2px}@media(min-width:760px){.grid{grid-template-columns:1.15fr 1fr}.span{grid-column:1/-1}body{padding-top:14px}.bosslist{max-height:390px}}@media(max-width:370px){.fields{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:22px}.card{padding:14px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
<div class="toolbar"><header><div><h1>木桩训练场</h1></div><button id="close" class="quiet">收起</button></header><div id="notice" role="status" aria-live="polite">连接中…</div><div id="health"></div><nav class="tabs" aria-label="训练项目"><button data-tab="dps" aria-selected="true">木桩测试</button><button data-tab="boss" aria-selected="false">Boss挑战</button><button data-tab="results" aria-selected="false">成绩</button></nav></div>
<main>
<section id="dps" class="grid"><div class="card"><h2>测试设置</h2><div class="fields"><label>测试时长<select id="seconds"><option value="30">30 秒</option><option value="60">60 秒</option><option value="120" selected>120 秒</option></select></label><label>目标数量<select id="targets"><option value="1">单目标</option><option value="3">3 个目标</option><option value="5">5 个目标</option></select></label><label>目标等级<input id="level" type="number" inputmode="numeric" min="1" max="110" value="100"></label><label>全抗性<select id="resistance"><option value="-20">-20%</option><option value="0">0%</option><option value="10" selected>10%</option><option value="30">30%</option><option value="50">50%</option><option value="70">70%</option><option value="90">90%</option></select></label><label class="full">开局元素能量<select id="energy"><option value="-1">保持当前能量</option><option value="0">0%</option><option value="50">50%</option><option value="100">100%</option></select></label><label class="checks full"><input id="heal" type="checkbox" checked>开局复活并回满生命</label></div><div class="row"><button id="start" class="primary">开始 120 秒测试</button><button id="again">重新测试</button></div><div class="row"><button id="stop" class="danger">结束并结算</button></div></div>
<div class="card"><h2>实时统计</h2><div class="statgrid"><div class="stat">剩余时间<b id="remaining">—</b></div><div class="stat">平均 DPS<b id="average">—</b></div><div class="stat">累计伤害<b id="total">—</b></div><div class="stat">命中次数<b id="hits">—</b></div></div><p id="runstate">未开始</p><div class="row"><button id="hud">收起游戏内统计</button></div></div>
<div class="card span"><h2>训练室</h2><p id="arena">当前位置</p><div class="row"><button id="enter">进入训练室</button><button id="leave">返回原地</button><button id="restore">复活回血</button><button id="fill">回满能量</button></div></div></section>
<section id="boss" class="grid" hidden><div class="card"><h2>选择 Boss</h2><label>搜索名称<input id="search" placeholder="浪涛锚定者、剑鬼、护刃…" autocomplete="off"></label><div class="bosslist" id="bosslist"></div></div><div class="card"><h2 id="selected">选择 Boss</h2><div class="fields"><label>等级<input id="bosslevel" type="number" min="1" max="110" value="100" inputmode="numeric"></label><label>生命值<select id="hpPreset"><option value="10000000">1,000 万</option><option value="50000000" selected>5,000 万</option><option value="100000000">1 亿</option><option value="500000000">5 亿</option><option value="1000000000">10 亿</option><option value="custom">自定义血量</option></select></label><label id="customHp" class="full" hidden>自定义生命值<input id="hp" type="number" min="1000" max="1000000000" value="50000000" inputmode="numeric"></label></div><div class="row"><button id="spawn" class="primary" disabled>召唤</button><button id="bossagain">再来一只</button></div><div class="row"><button id="clearboss" class="danger">清场</button></div><p id="bosshp"></p></div></section>
<section id="results" class="grid" hidden><div class="card span"><h2>本次登录 · 最近 10 次</h2><div id="records"><p>暂无成绩</p></div></div></section>
</main>
<script>
'use strict';let serial=0,pending=new Map(),view={},selected=null,busy=false,polling=false,lastOk=0;const $=id=>document.getElementById(id);
function bridge(action,args={}){return new Promise((resolve,reject)=>{if(!window.webkit?.messageHandlers?.training){reject(Error('请从游戏内打开训练场'));return}let id=++serial;let timer=setTimeout(()=>{pending.delete(id);reject(Error('连接超时，稍后重试'))},8000);pending.set(id,{resolve,reject,timer});window.webkit.messageHandlers.training.postMessage({id,action,args});})}
window.trainingReply=({id,payload})=>{let item=pending.get(id);if(!item)return;clearTimeout(item.timer);pending.delete(id);if(payload&&payload.retcode===0)item.resolve(payload);else item.reject(Error(payload?.message||'操作未完成'));};
function notice(text,error=false){$('notice').textContent=text;$('notice').hidden=!text;$('notice').classList.toggle('error',error)}
function number(id,min,max){let n=Number($(id).value);if(!Number.isInteger(n)||n<min||n>max)throw Error('请把'+$(id).closest('label').firstChild.textContent+'设在 '+min+'–'+max+' 之间。');return n}
function format(n){return Math.round(Number(n)||0).toLocaleString('zh-CN')}
function render(data){view=data;lastOk=Date.now();$('health').textContent=data.online?(data.ready?'世界已连接':'场景加载中'):'尚未进入世界';$('arena').textContent=data.inArena?'当前：训练室':'当前：大世界';$('leave').disabled=!data.canReturn;$('enter').disabled=!!data.inArena;let d=data.dps||{};$('remaining').textContent=d.active?d.remainingSeconds+' 秒':'—';$('average').textContent=d.active?format(d.averageDps):'—';$('total').textContent=d.active?format(d.totalDamage):'—';$('hits').textContent=d.active?format(d.hitCount):'—';$('runstate').textContent=d.active?'测试中':'未开始';$('hud').textContent=data.showHud===false?'显示游戏内统计':'收起游戏内统计';$('bosshp').textContent=data.boss?'当前生命 '+format(data.boss.hp)+' / '+format(data.boss.maxHp):'';renderBosses();let records=$('records');records.replaceChildren();for(let r of data.results||[]){let row=document.createElement('div');row.className='record';let left=document.createElement('div');left.textContent=r.seconds+'秒 · '+format(r.hitCount)+'次命中';let small=document.createElement('div');small.className='muted';small.textContent='总伤害 '+format(r.totalDamage)+' · 最高一击 '+format(r.maxHit);left.append(small);let right=document.createElement('b');right.textContent='DPS '+format(r.averageDps);row.append(left,right);records.append(row);let detail=document.createElement('p');detail.className='muted';detail.textContent=Object.entries(r.byElement||{}).map(([k,v])=>k+' '+format(v)).join(' · ');if(Object.keys(r.byReaction||{}).length)detail.textContent+=' ｜ '+Object.entries(r.byReaction).map(([k,v])=>k+' '+format(v)).join(' · ');records.append(detail)}if(!records.children.length)records.textContent='暂无成绩'}
function renderBosses(){let list=$('bosslist'),key=$('search').value.trim();let rows=(view.bosses||[]).filter(b=>b.name.includes(key));let signature=JSON.stringify(rows.map(b=>b.id))+':'+selected;if(list.dataset.signature===signature)return;list.dataset.signature=signature;list.replaceChildren();for(let b of rows){let button=document.createElement('button');button.className='boss';button.disabled=!b.available;button.dataset.available=String(b.available);button.setAttribute('aria-pressed',String(selected===b.id));let title=document.createElement('span');title.textContent=b.name;let state=document.createElement('small');state.textContent=b.available?(b.note==='7.2 新增'?'7.2':''):'暂不可用';button.append(title,state);button.onclick=()=>{selected=b.id;$('selected').textContent=b.name;$('spawn').disabled=false;renderBosses();controls()};list.append(button)}if(!rows.length)list.textContent='没有匹配结果'}
async function refresh(){if(polling||busy)return;polling=true;try{render(await bridge('status'));if(!view.online)notice('请先进入世界')}catch(e){if(Date.now()-lastOk>3000){$('runstate').textContent='同步中…';view.ready=false;notice(e.message,true)}}finally{polling=false;controls()}}
function controls(){
 document.querySelectorAll('button:not(#close)').forEach(b=>b.disabled=busy);
 if(busy)return;
 document.querySelectorAll('.boss').forEach(b=>b.disabled=b.dataset.available!=='true');
 $('spawn').disabled=!view.ready||!(view.bosses||[]).some(b=>b.id===selected&&b.available);
 $('start').disabled=!view.ready||!!view.dps?.active;$('again').disabled=!view.ready||!view.hasPreviousDps;
 $('stop').disabled=!view.dps?.active;$('bossagain').disabled=!view.ready||!view.hasPreviousBoss;
 $('clearboss').disabled=!view.boss;$('leave').disabled=!view.ready||!view.canReturn;
 $('enter').disabled=!view.ready||!!view.inArena;
 for(let id of ['restore','fill','hud'])$(id).disabled=!view.ready;
}
async function act(action,args={}){if(busy)return;busy=true;controls();try{let data=await bridge(action,args);render(data);notice(data.message||'操作完成。');if(['dpsStart','dpsAgain','bossSpawn','bossAgain','arenaEnter','arenaExit'].includes(action))await bridge('close');}catch(e){notice(e.message,true)}finally{busy=false;controls()}}
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));for(let id of ['dps','boss','results'])$(id).hidden=id!==button.dataset.tab});
$('seconds').onchange=()=>{$('start').textContent='开始 '+$('seconds').value+' 秒测试'};$('search').oninput=renderBosses;
$('start').onclick=()=>{try{act('dpsStart',{seconds:number('seconds',1,120),targets:number('targets',1,5),level:number('level',1,110),resistance:number('resistance',-100,90),energy:number('energy',-1,100),heal:$('heal').checked})}catch(e){notice(e.message,true)}};
$('hpPreset').onchange=()=>{$('customHp').hidden=$('hpPreset').value!=='custom';if($('hpPreset').value!=='custom')$('hp').value=$('hpPreset').value};
$('spawn').onclick=()=>{try{act('bossSpawn',{id:selected,level:number('bosslevel',1,110),hp:number('hp',1000,1000000000)})}catch(e){notice(e.message,true)}};
for(let [id,action] of Object.entries({again:'dpsAgain',stop:'dpsStop',bossagain:'bossAgain',clearboss:'bossClear',enter:'arenaEnter',leave:'arenaExit',restore:'restoreHp',fill:'fillEnergy'}))$(id).onclick=()=>act(action);
$('hud').onclick=()=>act('hudToggle',{enabled:view.showHud===false});$('close').onclick=()=>bridge('close').catch(()=>{});
controls();refresh().then(()=>{if(view.online)notice('')});setInterval(refresh,1000);
</script></html>
