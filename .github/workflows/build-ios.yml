name: Build experimental iPhone runtime probe
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build a device IPA or run simulator acceptance tests
        type: choice
        options: [device, simulator]
        default: device
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '27'
      - name: Install build tools
        run: brew install autoconf make xcodegen
      - name: Restore matching host tools
        id: host-tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/mobile/build/macos-aarch64-server-release/images/jdk
          key: mobile-c13417aa36f8f447-macos-arm64-host-zero-guard-v1
      - name: Restore native build tree
        id: native-tree
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/mobile
          key: mobile-c13417aa36f8f447-native-${{ inputs.target }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: mobile-c13417aa36f8f447-native-${{ inputs.target }}-
      - name: Build unsigned device probe
        env:
          PROBE_SDK: ${{ inputs.target == 'simulator' && 'iphonesimulator' || 'iphoneos' }}
        run: bash scripts/build.sh
      - name: Cache completed host tools
        if: always() && steps.host-tools.outputs.cache-hit != 'true' && hashFiles('build/mobile/build/macos-aarch64-server-release/images/jdk/bin/jlink') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/mobile/build/macos-aarch64-server-release/images/jdk
          key: mobile-c13417aa36f8f447-macos-arm64-host-zero-guard-v1
      - name: Retain build results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iphone-runtime-probe-experiment
          retention-days: 7
          path: |
            build/RuntimeProbe.ipa
            build/build.log
            build/module-check.json
            build/OpenJDK.xcframework
            build/runtime
            build/DeviceProbe.jar
            build/simulator-results
      - name: Cache native build tree
        if: always() && steps.native-tree.outputs.cache-hit != 'true' && hashFiles('build/mobile/build/*/hotspot/variant-zero/libjvm/objs/static/libjvm.a') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/mobile
          key: mobile-c13417aa36f8f447-native-${{ inputs.target }}-${{ hashFiles('scripts/build.sh') }}
