name: Build experimental iPhone runtime probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '27'
      - name: Install build tools
        run: brew install autoconf make xcodegen
      - name: Build unsigned device probe
        run: bash scripts/build.sh
      - name: Retain build results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iphone-runtime-probe-experiment
          retention-days: 7
          path: |
            build/RuntimeProbe.ipa
            build/build.log
            build/module-check.json
            build/OpenJDK.xcframework
            build/runtime
            build/DeviceProbe.jar
