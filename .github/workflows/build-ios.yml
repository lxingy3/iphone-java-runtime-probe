name: Build experimental iPhone runtime probe
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build a device IPA or select a simulator profile
        type: choice
        options: [device, simulator, simulator-standard]
        default: device
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '27'
      - name: Select Duo-capable Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
      - name: Install build tools
        run: brew install autoconf make xcodegen
      - name: Download previously verified runtime
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.target != 'device' && '13853813081' || '13854995214' }}
        run: |
          mkdir -p build
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > build/verified-runtime.zip
      - name: Build and verify native app
        env:
          PROBE_SDK: ${{ inputs.target != 'device' && 'iphonesimulator' || 'iphoneos' }}
          PROBE_DEVICE_CLASS: ${{ inputs.target == 'simulator-standard' && 'standard' || 'duo' }}
          PROBE_RUNTIME_ARCHIVE: build/verified-runtime.zip
          PROBE_RUNTIME_SHA256: ${{ inputs.target != 'device' && 'dafa3dbbf5002b767d2c1a372192aa42a914bef3cb447020cedf74a20f8f630d' || '5372283f51e83787b92df5f738d350e38373ae5d151cdc014e3b835d9fc78d25' }}
        run: bash scripts/build.sh
      - name: Retain build results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iphone-runtime-probe-experiment
          retention-days: 7
          path: |
            build/RuntimeProbe.ipa
            build/build.log
            build/toolchain.json
            build/module-check.json
            build/directory-identity-test.json
            build/OpenJDK.xcframework
            build/runtime
            build/DeviceProbe.jar
            build/RuntimePatch.jar
            build/RuntimeHostKit
            build/simulator-results
