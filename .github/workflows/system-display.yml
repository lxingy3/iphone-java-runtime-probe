name: Observe system-driven Duo display transitions
on:
  push:
    branches: [duo-system-transitions]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
      - run: python3 scripts/test_system_displays.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: duo-system-displays
          retention-days: 7
          path: build/system-displays
